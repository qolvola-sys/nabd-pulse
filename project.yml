name: Nabd
options:
  bundleIdPrefix: com.nabd
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Release

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Nabd:
    type: application
    platform: iOS
    sources:
      - path: Nabd
        excludes:
          - "Info.plist"
          - "ar.lproj"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nabd.pulse
        PRODUCT_NAME: Nabd
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: Nabd/Info.plist
      properties:
        CFBundleDisplayName: "نبض"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleName: "Nabd"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: "APPL"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: "ar"
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # يسمح باختبار خادمك عبر HTTP على شبكة محلية أثناء التجربة.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: "com.nabd.pulse.oauth"
            CFBundleTypeRole: "Editor"
            CFBundleURLSchemes:
              - "nabd"
        UIViewControllerBasedStatusBarAppearance: false

  Mutabaa:
    type: application
    platform: iOS
    sources:
      - path: Nabd
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nabd.mutabaa
        PRODUCT_NAME: Mutabaa
        MARKETING_VERSION: "1.6.1"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "MUTABAA"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: Mutabaa/Info.plist
      properties:
        CFBundleDisplayName: "المتابعة"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleName: "Mutabaa"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: "APPL"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: "ar"
        CFBundleLocalizations:
          - ar
        CFBundleShortVersionString: "1.6.1"
        CFBundleVersion: "10"
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: "com.nabd.mutabaa.oauth"
            CFBundleTypeRole: "Editor"
            CFBundleURLSchemes:
              - "mutabaa"
        UIViewControllerBasedStatusBarAppearance: false

