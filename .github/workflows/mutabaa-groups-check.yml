name: Mutabaa Groups 7 Check

on:
  push:
    branches:
      - "mutabaa-groups-7"
  workflow_dispatch:

jobs:
  ui-test:
    name: Build and verify groups on simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Nabd.xcodeproj \
            -scheme MutabaaUITests \
            -configuration Debug \
            -destination "id=$DEVICE" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Inspect app bundle
        run: |
          APP=$(find build-test/Build/Products/Debug-iphonesimulator -maxdepth 2 -name "Mutabaa.app" | head -1)
          echo "APP=$APP"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleShortVersionString|CFBundleVersion|CFBundleIdentifier" || true
          plutil -p "$APP/Info.plist" | grep -i -A4 "Localizations" || true
          ls "$APP" | grep -i lproj || echo "no lproj"

      - name: Install app and seed legacy data
        run: |
          APP=$(find build-test/Build/Products/Debug-iphonesimulator -maxdepth 2 -name "Mutabaa.app" | head -1)
          echo "APP=$APP"
          xcrun simctl install "$DEVICE" "$APP"
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.nabd.mutabaa data)
          mkdir -p "$DATA/Documents"
          export DATA
          python3 - <<'PY'
          import json
          import os

          saved = "2026-10-26T01:30:00.000Z"

          def acc(index):
              handle = f"user{index:02d}"
              name = f"حساب {index:02d}"
              followers = 200000 - index * 7000
              posts = 90 - index * 3
              views24h = 50000 - index * 2500
              weekly = 1300000 - index * 60000
              return {
                  "id": "direct-" + handle,
                  "platform": "tiktok",
                  "handle": handle,
                  "url": "https://www.tiktok.com/@" + handle,
                  "displayName": name,
                  "isVerified": True,
                  "followers": followers,
                  "following": 120,
                  "likes": followers * 12,
                  "posts": posts,
                  "views": weekly * 4 + views24h,
                  "videoLikes": max(weekly // 20, 1),
                  "comments": max(weekly // 200, 1),
                  "shares": max(weekly // 400, 1),
                  "fetchedVideos": posts,
                  "posts24h": 2,
                  "views24h": views24h,
                  "posts7d": 6,
                  "weeklyViews": weekly,
                  "avgViews": (weekly * 4 + views24h) // max(posts, 1),
                  "coverage": 1.0,
                  "connected": True,
                  "publicStats": True,
                  "profileExact": True,
                  "viewsExact": True,
                  "dailyComplete": True,
                  "dailyViewsExact": True,
                  "weeklyComplete": True,
                  "weeklyViewsExact": True,
                  "allPostsLoaded": True,
                  "status": "public",
                  "lastSyncedAt": saved,
                  "createdAt": "2025-01-01T00:00:00.000Z",
              }

          accounts = [acc(i) for i in range(1, 11)]

          # نسخة قديمة بلا مساحات ولا مجموعات لاختبار الترحيل التلقائي.
          payload = {
              "savedAt": saved,
              "accounts": accounts,
              "videos": {},
          }

          path = os.path.join(os.environ["DATA"], "Documents", "nabd-direct.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False)
          print(path)
          PY

      - name: Run UI test
        run: |
          rm -rf TestResults.xcresult
          xcodebuild test-without-building \
            -project Nabd.xcodeproj \
            -scheme MutabaaUITests \
            -configuration Debug \
            -destination "id=$DEVICE" \
            -derivedDataPath build-test \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path shots || true
          echo "---"
          find shots -maxdepth 2 -type f -print || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutabaa-groups-7
          path: |
            shots
            TestResults.xcresult
          retention-days: 7
