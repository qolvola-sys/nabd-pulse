name: Build IPAs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build unsigned IPAs
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ---------------------------------------------------------------- نبض
      - name: Build Nabd (no code signing)
        run: |
          xcodebuild \
            -project Nabd.xcodeproj \
            -scheme Nabd \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify Nabd Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/Build/Products/Release-iphoneos/Nabd.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" build/Build/Products/Release-iphoneos/Nabd.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" build/Build/Products/Release-iphoneos/Nabd.app/Info.plist

      - name: Package Nabd IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Nabd.app"
          ls -la "$APP_PATH"
          rm -rf Payload Nabd.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q Nabd.ipa Payload
          ls -lh Nabd.ipa

      # ----------------------------------------------------------- المتابعة
      - name: Build Mutabaa (no code signing)
        run: |
          xcodebuild \
            -project Nabd.xcodeproj \
            -scheme Mutabaa \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify Mutabaa Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/Build/Products/Release-iphoneos/Mutabaa.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" build/Build/Products/Release-iphoneos/Mutabaa.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" build/Build/Products/Release-iphoneos/Mutabaa.app/Info.plist

      - name: Package Mutabaa IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Mutabaa.app"
          ls -la "$APP_PATH"
          rm -rf Payload Mutabaa.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q Mutabaa.ipa Payload
          ls -lh Mutabaa.ipa

      - name: Copy IPAs to ipa-out
        run: |
          mkdir -p ipa-out
          cp Nabd.ipa ipa-out/Nabd.ipa
          cp Mutabaa.ipa ipa-out/Mutabaa.ipa

      - name: Upload Nabd IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nabd-unsigned-ipa
          path: Nabd.ipa
          retention-days: 30

      - name: Upload Mutabaa IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mutabaa-unsigned-ipa
          path: Mutabaa.ipa
          retention-days: 30
